name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_ASSET_NAME: headroom.exe
  WINGET_PACKAGE_ID: DannyLamphere.Headroom

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release --locked

      - name: Tag must match Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $cargo = (Get-Content Cargo.toml -Raw)
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "version not found in Cargo.toml" }
          if ($Matches[1] -ne $tag) { throw "tag v$tag does not match Cargo.toml version $($Matches[1])" }

      - name: Build release binary
        run: |
          cargo build --release --locked
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\headroom.exe dist\headroom.exe

      # The in-app updater refuses a release without this file and verifies
      # the download against it.
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\headroom.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  headroom.exe" | Set-Content -NoNewline dist\headroom.exe.sha256

      # Unsigned: Partner Center signs Store submissions. The sideload build
      # for testers is made locally with build-msix.ps1 -DevSign.
      - name: Pack MSIX
        shell: pwsh
        run: |
          .\packaging\msix\make-assets.ps1
          .\packaging\msix\build-msix.ps1 -Version ("${{ github.ref_name }}".TrimStart('v'))

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/headroom.exe
            dist/headroom.exe.sha256
            packaging/msix/out/*.msix
          generate_release_notes: true

  winget:
    needs: build
    runs-on: windows-latest
    env:
      WINGETCREATE_GITHUB_TOKEN: ${{ secrets.WINGETCREATE_GITHUB_TOKEN }}
    steps:
      - name: Prepare release metadata
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $packageUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/${{ env.RELEASE_ASSET_NAME }}"

          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "PACKAGE_URL=$packageUrl" >> $env:GITHUB_ENV

      - name: Skip when winget token is not configured
        if: env.WINGETCREATE_GITHUB_TOKEN == ''
        shell: pwsh
        run: |
          Write-Warning "Skipping WinGet submission because WINGETCREATE_GITHUB_TOKEN is not configured."

      - name: Install .NET 6 runtime
        if: env.WINGETCREATE_GITHUB_TOKEN != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Download wingetcreate
        if: env.WINGETCREATE_GITHUB_TOKEN != ''
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit WinGet manifest update
        if: env.WINGETCREATE_GITHUB_TOKEN != ''
        shell: pwsh
        run: |
          .\wingetcreate.exe update `
            --submit `
            --token $env:WINGETCREATE_GITHUB_TOKEN `
            --urls $env:PACKAGE_URL `
            --version $env:PACKAGE_VERSION `
            $env:WINGET_PACKAGE_ID
